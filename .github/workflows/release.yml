name: Create Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build Binaries
    needs: [test]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.ref_name }}
          BINARY_NAME="dcal-linux-${{ matrix.goarch }}"
          cd core
          go build -ldflags "-s -w -X main.Version=${VERSION#v}" -o "../${BINARY_NAME}" ./cmd/dcal
          cd ..
          gzip -c "${BINARY_NAME}" > "${BINARY_NAME}.gz"
          tar -czf "${BINARY_NAME}.tar.gz" "${BINARY_NAME}"
          sha256sum "${BINARY_NAME}.gz" > "${BINARY_NAME}.gz.sha256"
          sha256sum "${BINARY_NAME}.tar.gz" > "${BINARY_NAME}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcal-linux-${{ matrix.goarch }}
          path: |
            dcal-linux-${{ matrix.goarch }}.gz
            dcal-linux-${{ matrix.goarch }}.gz.sha256
            dcal-linux-${{ matrix.goarch }}.tar.gz
            dcal-linux-${{ matrix.goarch }}.tar.gz.sha256

  package_completions:
    name: Package Shell Completions
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod

      - name: Generate completions
        run: |
          VERSION_NUM=${GITHUB_REF_NAME#v}
          cd core
          go build -o /tmp/dcal ./cmd/dcal
          mkdir -p completions
          /tmp/dcal completion bash > completions/dcal
          /tmp/dcal completion zsh > completions/_dcal
          /tmp/dcal completion fish > completions/dcal.fish
          /tmp/dcal completion powershell > completions/dcal.ps1
          tar -czf "../dcal-completions-${VERSION_NUM}.tar.gz" -C completions .
          cd ..
          sha256sum "dcal-completions-${VERSION_NUM}.tar.gz" > "dcal-completions-${VERSION_NUM}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcal-completions
          path: |
            dcal-completions-*.tar.gz
            dcal-completions-*.tar.gz.sha256

  package_shell:
    name: Package Shell Config
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Create shell tarball
        run: |
          VERSION_NUM=${GITHUB_REF_NAME#v}
          tar -czf "dankcalendar-shell-${VERSION_NUM}.tar.gz" \
            --transform "s,^quickshell,dankcal," \
            quickshell
          sha256sum "dankcalendar-shell-${VERSION_NUM}.tar.gz" > "dankcalendar-shell-${VERSION_NUM}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dankcalendar-shell
          path: |
            dankcalendar-shell-*.tar.gz
            dankcalendar-shell-*.tar.gz.sha256

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, package_shell, package_completions]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --oneline --pretty=format:"- %s (%h)" | head -50)
          else
            CHANGELOG=$(git log --oneline --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          fi

          cat > CHANGELOG.md << EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ github.ref_name }}
          EOF

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod

      - name: Generate vendored source tarball
        run: |
          VERSION_NUM=${GITHUB_REF_NAME#v}
          cd core && go mod vendor && cd ..
          tar czf "dankcalendar-${VERSION_NUM}.tar.gz" \
            --transform "s,^,dankcalendar-${VERSION_NUM}/," \
            --exclude=./artifacts --exclude=.git --exclude="dankcalendar-*.tar.gz" *

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ github.ref_name }}
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file CHANGELOG.md \
            $PRERELEASE_FLAG

          find ./artifacts -type f \( -name "dcal-*" -o -name "dankcalendar-*" \) | while read file; do
            echo "Uploading: $file"
            gh release upload "$VERSION" "$file" --clobber
          done

          VERSION_NUM=${VERSION#v}
          gh release upload "$VERSION" "dankcalendar-${VERSION_NUM}.tar.gz" --clobber
